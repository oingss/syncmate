name: Build Android

on:
  workflow_dispatch:

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/syncmate_android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ 目录已含 Manifest 与 Kotlin（org.syncmate.app），
      # flutter create 仅补齐缺失的 gradle/wrapper 等文件。
      - name: 生成 Android 平台工程并修正包名
        run: |
          flutter create --platforms android --org org.syncmate .
          flutter pub get
          sed -i 's/org\.syncmate\.syncmate_android/org.syncmate.app/g' android/app/build.gradle.kts
          grep -n "org.syncmate.app" android/app/build.gradle.kts
      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        run: flutter test

      - name: 编译 Release APK（分架构，仅 arm64-v8a）
        run: flutter build apk --release --split-per-abi --target-platform android-arm64
          
      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: test
          name: syncmate test
          prerelease: false
          make_latest: true
          files: apps/syncmate_android/build/app/outputs/flutter-apk/*
