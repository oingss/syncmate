name: Build Windows

on:
  workflow_dispatch:

concurrency:
  group: build-windows
  cancel-in-progress: true

jobs:
  build:
    runs-on: windows-latest
    defaults:
      run:
        working-directory: apps/syncmate_windows
    steps:
      - uses: actions/checkout@v4

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # windows/ 尚未生成时由 flutter create 补齐；已有文件不会被覆盖
      # （pubspec、lib、test 保持仓库版本）。
      - name: 生成 Windows 平台工程
        run: |
          flutter create --platforms windows .
          flutter pub get

      - name: 静态分析
        run: flutter analyze

      - name: 单元测试
        run: flutter test

      - name: 编译 Release
        run: flutter build windows --release

      - uses: actions/upload-artifact@v4
        with:
          name: syncmate-windows
          path: apps/syncmate_windows/build/windows/x64/runner/Release/
          if-no-files-found: error
