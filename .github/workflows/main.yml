name: Build Android

on:
  push:
    branches: [main, master]
  workflow_dispatch:

concurrency:
  group: build-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/syncmate_android
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          cache: true

      # android/ 目录已含 Manifest 与 Kotlin（org.syncmate.app），
      # flutter create 仅补齐缺失的 gradle/wrapper 等文件。
      - name: 生成 Android 平台工程并修正包名
        run: |
          flutter create --platforms android --org org.syncmate .
          flutter pub get
          sed -i 's/org\.syncmate\.syncmate_android/org.syncmate.app/g' android/app/build.gradle.kts
          grep -n "org.syncmate.app" android/app/build.gradle.kts

      - name: 静态分析
        continue-on-error: true
        run: flutter analyze

      - name: 编译 Release APK
        run: flutter build apk --release

      - uses: actions/upload-artifact@v4
        with:
          name: syncmate-android
          path: apps/syncmate_android/build/app/outputs/flutter-apk/app-release.apk
          if-no-files-found: error
